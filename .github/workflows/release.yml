name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; the release job opts into contents: write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go vet ./...
      # -v prints every --- SKIP --- line and -count=1 bypasses the test cache,
      # so an environment-dependent skip (e.g. the multicast socket-option test
      # on a host without a multicast-capable interface) is visible instead of
      # looking like a silent pass. Skips are informational: the relay's real
      # multicast behaviour is not asserted by this job and is not claimed to
      # work on every target.
      - name: go test -race (verbose)
        run: |
          set -o pipefail
          go test -race -v -count=1 ./... 2>&1 | tee /tmp/go-test.log
      - name: surface skipped tests
        if: always()
        run: |
          echo "::group::skipped tests"
          if grep -E '^[[:space:]]*--- SKIP:' /tmp/go-test.log; then
            echo "NOTE: the tests above were skipped in this environment (not a failure)."
          else
            echo "(none)"
          fi
          echo "::endgroup::"
      - run: make -C packaging/rutos check

  # Optional, non-blocking 32-bit countercheck. The Go race detector does not
  # support linux/arm, so the tests run plain under qemu-user here. This job
  # never gates the release (continue-on-error) and is a logic countercheck
  # only: it makes no claim that multicast, discovery or MTU handling works on
  # every target. Production discovery, real link-flap and two-interface
  # isolation remain unproven by CI (see STABILIZATION.md "Remaining boundaries").
  arm-qemu:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
      - name: build armv6 test binaries
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "6"
          CGO_ENABLED: "0"
        run: |
          go test -c -o relay.test ./internal/relay
          go test -c -o main.test ./cmd/mdns-vpn-bridge
      # Static Go binaries need no dynamic loader, so no -L prefix is required.
      - name: run under qemu-arm
        run: |
          qemu-arm ./relay.test -test.v
          qemu-arm ./main.test -test.v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: linux-amd64,  goarch: amd64 }
          - { name: linux-arm64,  goarch: arm64 }
          - { name: linux-armv7,  goarch: arm,   goarm: 7 }
          - { name: linux-armv6,  goarch: arm,   goarm: 6 }
          - { name: linux-mips,   goarch: mips,  gomips: hardfloat }
          - { name: linux-mipsle, goarch: mipsle }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: build
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "mdns-vpn-bridge-${{ matrix.name }}" ./cmd/mdns-vpn-bridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: mdns-vpn-bridge-${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum mdns-vpn-bridge-* > sha256sums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            mdns-vpn-bridge-*
            sha256sums.txt
          generate_release_notes: true
